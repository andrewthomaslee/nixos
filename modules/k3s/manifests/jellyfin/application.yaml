apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: kube-system
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: jellyfin
    repoURL: https://jellyfin.github.io/jellyfin-helm
    targetRevision: 2.7.0
    helm:
      releaseName: jellyfin
      values: |
        persistence:
          media:
            enabled: true
            type: hostPath
            hostPath: /mnt/storagebox/Media
          config:
            enabled: true
            size: 5Gi
            storageClass: local-path
        extraVolumes:
          - name: dri
            hostPath:
              path: /dev/dri
        extraVolumeMounts:
          - name: dri
            mountPath: /dev/dri
        ingress:
          enabled: true
          className: traefik
          hosts:
            - host: jellyfin.andrewlee.cloud
              paths:
                - path: /
                  pathType: Prefix
        resources:
          limits:
            cpu: 4000m
            memory: 8Gi
          requests:
            cpu: 100m
            memory: 128Mi
        nodeSelector:
          host: kamrui-p1
        securityContext:
          privileged: true
  destination:
    server: "https://kubernetes.default.svc"
    namespace: jellyfin
  
  syncPolicy:
    syncOptions:
      - PruneLast=true
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true