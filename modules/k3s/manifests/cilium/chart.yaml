apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cilium
  namespace: kube-system
spec:
  bootstrap: true
  repo: https://helm.cilium.io/
  chart: cilium
  version: 1.20.0-pre.0
  targetNamespace: kube-system
---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: cilium
  namespace: kube-system
spec:
  valuesContent: |-
    devices: "lo"
    MTU: 65535
    kubeProxyReplacement: true
    k8sServiceHost: "127.0.0.1"
    k8sServicePort: 6443
    operator:
      replicas: 1
    ipv4:
      enabled: true
    ipv6:
      enabled: true
    ipam:
      mode: "kubernetes"
      operator:
        clusterPoolIPv4PodCIDRList: ["10.42.0.0/16"]
        clusterPoolIPv6PodCIDRList: ["fd42::/56"]
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true